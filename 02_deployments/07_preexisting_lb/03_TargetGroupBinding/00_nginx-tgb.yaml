# nginx-tgb.yaml
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: nginx-ingress-tgb
  namespace: ingress-nginx
spec:
  serviceRef:
    name: nginx-ingress-ingress-nginx-controller
    port: 80
  targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:891377015964:targetgroup/nginx-precreated-tg/ce53a05945c89abf
  targetType: ip
  networking:
    ingress:
      - from:
          - ipBlock:
              cidr: "0.0.0.0/0"
        ports:
          - protocol: TCP
            port: 80
